# Summary: Adjust the backrest, the leg section, and the lumbar support with Matter buttons. Return the bed to flat.
# Setup: Check characters 9 and 10 of the bed’s Bluetooth name. Use this recipe for 15, 25, 35, 45, 65, 85, A2, A3, A4, A5, A6, A7, A8, B2, B3, B4, B5, B6, B7, B8, C2, C3, C4, C5, C6, C7, and C8.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: MotoSleep 15
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 60
  commands:
    - label: Stop
      bytes: "2462"
      times: 5
      gap: 100
    - label: Backrest up
      bytes: "244B"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Backrest down
      bytes: "244C"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Legs up
      bytes: "244D"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Legs down
      bytes: "244E"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Lumbar up
      bytes: "2450"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Lumbar down
      bytes: "2451"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Flat
      bytes: "244F"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Stop
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest up
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Backrest down
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs up
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Legs down
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Lumbar up
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Lumbar down
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Flat
