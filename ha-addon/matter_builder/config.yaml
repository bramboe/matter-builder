# Matter Builder: builds, links and updates the Matter/Thread proxies
# (ESP32) of this repo from Home Assistant.
name: Matter Builder
version: "0.16.0"
slug: matter_builder
description: Build, link and update ESP32 Matter/Thread proxies
arch:
  - amd64
init: false
startup: application
boot: auto
# Thread addresses are routed through the OpenThread Border Router on the
# host, and configuration mode is found with mDNS: both need the host network
host_network: true
ingress: true
# Only for a notification when a new device is found
homeassistant_api: true
# USB serial ports, for installing on an ESP32 plugged into this machine
uart: true
# Flash backups go to /share/matter-builder/backups
map:
  - share:rw
ingress_port: 8099
panel_icon: mdi:chip
panel_title: Matter Builder
# The toolchain (±6 GB) and build output can be downloaded or rebuilt again
backup_exclude:
  - toolchain
  - build
  - work
  - ccache
  - component-cache
# Where ready-made, signed firmware comes from (GitHub "owner/repository")
options:
  releases_repo: bramboe/matter-builder
schema:
  releases_repo: str
