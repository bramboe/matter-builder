name: Release

# Ready-made firmware for users who do not build: the same toolchain and
# scripts as the Home Assistant add-on's developer mode (ha-addon/matter_builder),
# so a release can be rebuilt there and compared. A tag "v<version>" builds
# the Octo bridge and the generic device for the ESP32-C6, writes a manifest
# with SHA-256 hashes, signs it (secret MB_SIGNING_KEY, ECDSA P-256) and
# publishes everything as a GitHub release. The add-on checks the signature
# against ha-addon/matter_builder/release-key.pem before it installs anything.
#
# The Matter toolchain needs more disk than a runner has free, so the build
# runs in Espressif's image on the runner's large /mnt disk, after removing
# preinstalled software the build does not use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  IDF_IMAGE: espressif/idf:v5.5.5
  ESP_MATTER_COMMIT: fe1efc6cdf62f19b5ca44213900333a6aad7a8b2

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/mb && sudo chown "$(id -u):$(id -g)" /mnt/mb
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: /mnt/mb/toolchain
          key: toolchain-${{ env.ESP_MATTER_COMMIT }}-2

      - name: Toolchain and build (Espressif image)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v /mnt/mb:/mb \
            -e MB_DATA=/mb -e MB_SRC=/src -e ESP_MATTER_COMMIT \
            -e IDF_PYTHON_ENV_PATH=/mb/toolchain/python_env -e HOME=/mb/home \
            "$IDF_IMAGE" bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential pkg-config libffi-dev libssl-dev \
                libdbus-1-dev libglib2.0-dev libavahi-client-dev libgirepository1.0-dev libcairo2-dev \
                libreadline-dev python3-dev python3-venv unzip > /dev/null
              if [ ! -f "/mb/toolchain/ready-$ESP_MATTER_COMMIT" ]; then
                bash /src/ha-addon/matter_builder/toolchain.sh
              fi
              bash /src/ha-addon/matter_builder/build.sh bridge
              bash /src/ha-addon/matter_builder/build.sh generic
              chown -R '"$(id -u):$(id -g)"' /mb'

      - name: Manifest and signature
        env:
          MB_SIGNING_KEY: ${{ secrets.MB_SIGNING_KEY }}
        run: python3 tools/release_manifest.py /mnt/mb/firmware "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Signed firmware for the ESP32-C6" \
            /mnt/mb/firmware/*.bin /mnt/mb/firmware/manifest.json /mnt/mb/firmware/manifest.json.sig
