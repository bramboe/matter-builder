# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat, recall Zero G, and recall the anti-snore preset.
# Setup: Check characters 9 and 10 of the bed’s Bluetooth name. Use this recipe for 92.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: MotoSleep 92
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 60
  commands:
    - label: Stop
      bytes: "2462"
      times: 5
      gap: 100
    - label: Backrest up
      bytes: "244B"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Backrest down
      bytes: "244C"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Legs up
      bytes: "244D"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Legs down
      bytes: "244E"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Flat
      bytes: "244F"
    - label: Zero G
      bytes: "2454"
    - label: Anti-snore
      bytes: "2452"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Stop
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest up
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Backrest down
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs up
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Legs down
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Flat
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Zero G
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Anti-snore
