# Summary: Richmat Nordic met afstandsbedieningscode W6RM.
# Kies zowel de GATT-variant als de code op de afstandsbediening.
# Vereist de meegeleverde Matter Builder-patch.
device:
  name: Richmat Nordic W6RM
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "6E400001-B5A3-F393-E0A9-E50E24DCCA9E"
  characteristic: "6E400002-B5A3-F393-E0A9-E50E24DCCA9E"
  write: response
  idle: 60
  commands:
    - label: Rug omhoog
      bytes: "24"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Rug omlaag
      bytes: "25"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Benen omhoog
      bytes: "26"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Benen omlaag
      bytes: "27"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Stop
      bytes: "6E"
    - label: Vlak
      bytes: "31"
      finish: "6E"
      finish_gap: 50
    - label: Zero G
      bytes: "45"
      finish: "6E"
      finish_gap: 50
    - label: Licht wisselen
      bytes: "3C"
      finish: "6E"
      finish_gap: 50

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Rug omhoog
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Rug omlaag
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Benen omhoog
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Benen omlaag
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Stop
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Vlak
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Zero G
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Licht wisselen
