# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat, recall Zero G, and toggle the under-bed light.
# Setup: Use this recipe for remote code ZR10. Match the Bluetooth service and write characteristic listed below to your bed.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Richmat WiLinke 34BB ZR10
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "0000FEE9-0000-1000-8000-00805F9B34BB"
  characteristic: "D44BC439-ABFD-45A2-B575-925416129622"
  write: response
  idle: 60
  commands:
    - label: Backrest up
      bytes: "6E01002493"
      times: 6
      gap: 100
      finish: "6E01006EDD"
      finish_gap: 0
    - label: Backrest down
      bytes: "6E01002594"
      times: 6
      gap: 100
      finish: "6E01006EDD"
      finish_gap: 0
    - label: Legs up
      bytes: "6E01002695"
      times: 6
      gap: 100
      finish: "6E01006EDD"
      finish_gap: 0
    - label: Legs down
      bytes: "6E01002796"
      times: 6
      gap: 100
      finish: "6E01006EDD"
      finish_gap: 0
    - label: Stop
      bytes: "6E01006EDD"
    - label: Flat
      bytes: "6E010031A0"
      finish: "6E01006EDD"
      finish_gap: 50
    - label: Zero G
      bytes: "6E010045B4"
      finish: "6E01006EDD"
      finish_gap: 50
    - label: Toggle light
      bytes: "6E01003CAB"
      finish: "6E01006EDD"
      finish_gap: 50

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Stop
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Flat
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Zero G
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Toggle light
