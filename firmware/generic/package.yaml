# What the release says about this firmware (tools/release_manifest.py);
# the add-on shows it. Format 1 of the package description.
name: generic
app: mb_generic
kind: standard
format: 1
title: Generic device
description: Relays, LEDs, buttons, contacts, motion and SHT4x sensors, infrared codes and Bluetooth thermometers or presence tags, set up on the device or in the add-on.
# Bluetooth is optional: it starts only for a Bluetooth connection
requires: []
# Thread or Wi-Fi on the ESP32-C6 (chosen when installing); Wi-Fi on the
# classic ESP32. Every chip needs 8 MB of flash.
network: [thread, wifi]
chips: [esp32c6, esp32]
