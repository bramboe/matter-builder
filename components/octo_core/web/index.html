<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octo beds</title>
<style>
/* Colours, radii and spacing follow the Home Assistant frontend */
:root{--primary:#009ac7;--bg:#f0f0f0;--card:#fff;--fg:#141414;--mute:#727272;--line:#e0e0e0;--fill:#f5f5f5;
--ok:#43a047;--bad:#db4437;--light:#ff9800;--chip:rgba(0,154,199,.15);--radius:12px}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--fg:#e1e1e1;--mute:#9b9b9b;--line:#2f2f2f;--fill:#2a2a2a;--chip:rgba(0,154,199,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
svg{width:24px;height:24px;fill:currentColor;flex:none}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 4px 0 16px;background:var(--bg)}
header h1{flex:1;margin:0;font-size:20px;font-weight:400}
header .sub{font-size:12px}
main{max-width:1000px;margin:0 auto;padding:4px 16px 96px}
.sub{color:var(--mute)}
.section{margin:20px 0 8px}
.section-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 10px}
.section-head h2{margin:0;font-size:20px;font-weight:400}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.badge i.ok{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:500}
.tile{display:flex;align-items:center;gap:10px}
.tile .icon{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--primary)}
.tile .icon.light{background:rgba(255,152,0,.18);color:var(--light)}
.tile .name{font-weight:500}
.tile .state{color:var(--mute);font-size:12px}
.tile .info{flex:1;min-width:0}
.features{display:flex;gap:8px;margin-top:10px}
.features button{flex:1}
button{font:inherit;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:var(--radius);background:var(--fill);color:var(--fg);cursor:pointer}
button:hover{filter:brightness(.96)}
button.pri{background:var(--primary);color:#fff}
button.text{background:none;color:var(--primary);padding:0 10px}
button.warn{background:none;color:var(--bad)}
button.icon-btn{background:none;width:40px;padding:0;border-radius:50%}
button:disabled{opacity:.38;cursor:default;filter:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:32px;border-radius:8px;border:1px solid var(--line);background:none;padding:0 12px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .label{flex:1;min-width:0}
.row .label .sub{font-size:12px}
.field{display:flex;flex-direction:column;min-width:0;background:var(--fill);border-radius:4px 4px 0 0;border-bottom:1px solid var(--mute);padding:6px 12px 4px}
.field:focus-within{border-bottom:2px solid var(--primary);padding-bottom:3px}
.field span{font-size:12px;color:var(--mute)}
.field input,.field select{font:inherit;border:0;background:none;color:var(--fg);padding:2px 0;outline:none;min-width:0}
.field.short{width:96px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
details{border-top:1px solid var(--line);margin-top:10px}
summary{display:flex;align-items:center;min-height:48px;cursor:pointer;font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;margin-right:6px;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg)}
details[open] summary::after{transform:rotate(-135deg)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrwrap svg{width:148px;height:148px;border-radius:8px}
.code{font-size:20px;letter-spacing:.04em;margin:2px 0 6px}
pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mute);margin:4px 0 8px}
.head-actions{margin-left:auto;display:flex}
.measure{margin:8px 0 0;font-weight:500;color:var(--primary)}
.menu{position:absolute;right:8px;top:48px;min-width:200px;background:var(--card);border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:8px 0;display:none}
.menu.open{display:block}
.menu button{width:100%;justify-content:flex-start;border-radius:0;background:none;min-height:44px;font-weight:400}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140px);max-width:calc(100% - 32px);background:#323232;color:#f1f1f1;border-radius:4px;padding:12px 16px;box-shadow:0 3px 6px rgba(0,0,0,.3);transition:transform .2s;white-space:pre-wrap;z-index:3}
#toast.show{transform:translate(-50%,0)}
</style>
</head>

    </div>
  </div>
</div>
</main>

let lang = 'en';
try { lang = localStorage.getItem('octoLang') || (navigator.language || 'en').slice(0, 2); } catch (e) {}
if (!TEXT[lang]) lang = 'en';
const t = (key, ...args) => { const v = TEXT[lang][key] ?? TEXT.en[key]; return typeof v === 'function' ? v(...args) : v; };

function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#lang').value = lang;
}

const $ = s => document.querySelector(s);
const icon = n => `<svg><use href="#i-${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const quote = s => esc(s).replace(/'/g, '');
let token = '';
try { token = localStorage.getItem('octoToken') || ''; } catch (e) {}
let state = null, presets = null, toastTimer = 0;

function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function askToken() {
  const value = prompt(t('passwordPrompt'), token);
  if (value !== null) {
    token = value.trim();
    try { localStorage.setItem('octoToken', token); } catch (e) {}
  }
}

async function cmd(line) {
  const r = await fetch('/cmd', {method: 'POST', headers: {'X-Octo-Token': token}, body: line});
  const text = await r.text();
  if (r.status === 401) { askToken(); throw new Error(t('passwordRefused')); }
  return text;
}

async function run(line) {
  try { toast((await cmd(line)).trim() || 'OK'); refresh(); }
  catch (e) { toast(t('error') + ': ' + e.message); }
}

// Shown the Home Assistant way: 0 % flat, 100 % fully raised
const pos = v => v === undefined ? '' : v === 0 ? t('flat') : v >= 100 ? t('fullyRaised') : t('raised', v);

function motorTile(b, part, label, value) {
  const i = b.index, dis = b.state === 'ready' ? '' : 'disabled';
  return `<div class="card">
    <div class="tile"><div class="icon">${icon('bed')}</div>
      <div class="info"><div class="name">${label}</div><div class="state">${pos(value)}</div></div></div>
    <div class="features">
      <button ${dis} title="${t('up')}" onclick="run('move ${i} ${part} up 2')">${icon('up')}</button>
      <button ${dis} title="${t('stop')}" onclick="run('stop ${i}')">${icon('stop')}</button>
      <button ${dis} title="${t('down')}" onclick="run('move ${i} ${part} down 2')">${icon('down')}</button>
    </div></div>`;
}

function lightTile(b) {
  const i = b.index, dis = b.state === 'ready' ? '' : 'disabled';
  return `<div class="card">
    <div class="tile"><div class="icon light">${icon('light')}</div>
      <div class="info"><div class="name">${t('light')}</div><div class="state">${t('underBed')}</div></div></div>
    <div class="features">
      <button ${dis} onclick="run('light ${i} off')">${t('off')}</button>
      <button ${dis} onclick="run('light ${i} on')">${t('on')}</button>
    </div></div>`;
}

// Presets come from the bridge ("preset list"); hidden when that fails
function presetCard(b, p) {
  if (!p) return '';
  const i = b.index, dis = b.state === 'ready' ? '' : 'disabled';
  const other = state.beds[1 - i];
  const slot = n => {
    const s = p.presets[n - 1];
    return `<button ${dis || (s ? '' : 'disabled')} title="${s ? t('headLegs', s.head, s.legs) : t('notSaved')}" onclick="run('preset ${i} ${n}')">${t('preset', n)}</button>`;
  };
  return `<div class="card">
    <h3>${t('presets')}</h3>
    <div class="chips">
      <button ${dis} onclick="run('preset ${i} flat')">${t('flat')}</button>${slot(1)}${slot(2)}${slot(3)}
      ${other && other.configured ? `<button ${dis} onclick="run('preset ${i} match')">${t('match', esc(other.name))}</button>` : ''}
    </div>
    <div class="row" style="margin-top:8px"><div class="label">${t('saveCurrent')}<div class="sub">${t('headLegs', p.head, p.legs)}</div></div>
      ${[1, 2, 3].map(n => `<button class="text" onclick="if (confirm('${quote(t('confirmSave', n))}')) run('preset ${i} save ${n}')">${n}</button>`).join('')}
    </div></div>`;
}

function calibrationCard(b) {
  const i = b.index, dis = b.state === 'ready' ? '' : 'disabled', cal = b.calibrating;
  const motor = (part, label, travel) => `
    <div class="row"><div class="label">${label}<div class="sub">${t('travelTime')}</div></div>
      <label class="field short"><span>${t('seconds')}</span><input type="number" step="0.1" min="5" max="120" value="${travel}" id="t${i}${part}"></label>
      <button class="text" onclick="run('travel ${i} ${part} ' + $('#t${i}${part}').value)">${t('save')}</button></div>
    <div class="steps">
      <button ${dis || (cal ? 'disabled' : '')} onclick="run('move ${i} ${part} down ' + (Math.min(${travel}, 120) + 5))">${t('step1')}</button>
      <button ${dis || (cal ? 'disabled' : '')} onclick="run('calibrate ${i} ${part}')">${t('step2')}</button>
      <button class="pri" ${cal === part ? '' : 'disabled'} onclick="run('calibrate ${i} stop')">${t('step3')}</button>
    </div>`;
  // Keep the panel open across redraws, and open it while measuring
  const open = cal || (document.getElementById('cal' + i) || {}).open ? 'open' : '';
  return `<div class="card">
    <h3>${t('calibration')}</h3>
    <div class="sub">${t('calibrationHelp')}</div>
    ${cal ? `<div class="measure">${t('measuring', t(cal === 'head' ? 'head' : 'legs').toLowerCase(), b.calibrate_elapsed.toFixed(1))}</div>` : ''}
    <details id="cal${i}" ${open}><summary>${t('travelsAndMeasure')}</summary>
      ${motor('head', t('head'), b.head_travel)}${motor('legs', t('legs'), b.legs_travel)}
    </details></div>`;
}

function bedSection(b) {
  if (!b.configured) return '';
  const ready = b.state === 'ready';
  const p = presets && presets.beds[b.index];
  const status = ready ? t('connected', b.rssi) : b.state;
  return `<div class="section">
    <div class="section-head"><h2>${esc(b.name)}</h2>
      <span class="badge"><i class="${ready ? 'ok' : ''}"></i>${esc(status)}</span>
      <span class="sub">${esc(b.mac)} · ${t('drops', b.drops)}</span>
      <span class="head-actions"><button class="text" onclick="renameBed(${b.index}, '${quote(b.name)}')">${t('rename')}</button>
        <button class="warn" onclick="removeBed(${b.index}, '${quote(b.name)}')">${t('remove')}</button></span></div>
    <div class="grid">
      ${motorTile(b, 'head', t('head'), p && p.head)}${motorTile(b, 'legs', t('legs'), p && p.legs)}${lightTile(b)}
      ${presetCard(b, p)}${calibrationCard(b)}
    </div></div>`;
}

// Discovery, as in Home Assistant: Octo beds seen over Bluetooth that are
// not added yet, each with "Add". A bed takes the first free slot.
let adding = null;  // address of the bed whose add form is open

function discoveredSection() {
  const added = state.beds.filter(b => b.configured).map(b => b.mac);
  const found = state.scan.filter(s => (s.octo || s.name === 'RC2') && s.seen < 120 && !added.includes(s.address))
    .sort((a, b) => b.rssi - a.rssi);
  const free = state.beds.find(b => !b.configured);
  if (!found.length) {
    return added.length ? '' : `<div class="section"><div class="section-head"><h2>${t('discovered')}</h2></div>
      <div class="card"><div class="sub">${t('searching')}</div></div></div>`;
  }
  return `<div class="section"><div class="section-head"><h2>${t('discovered')}</h2></div><div class="grid">${found.map(s => {
    const form = adding === s.address ? `
      <div class="form">
        <label class="field"><span>${t('name')}</span><input id="addName" maxlength="23" placeholder="${t('namePlaceholder')}"></label>
        <label class="field"><span>${t('bedPin')}</span><input id="addPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      </div>
      <div class="sub">${t('pinStored')}</div>
      <div class="features"><button onclick="adding = null; refresh()">${t('cancel')}</button>
        <button class="pri" onclick="addBed('${s.address}')">${t('add')}</button></div>` : `
      <div class="features"><button class="pri" ${free ? '' : `disabled title="${t('maxBeds')}"`}
        onclick="adding = '${s.address}'; refresh()">${t('add')}</button></div>`;
    return `<div class="card"><div class="tile"><div class="icon">${icon('bt')}</div>
      <div class="info"><div class="name">${t('octoBed')}${s.name ? ' (' + esc(s.name) + ')' : ''}</div>
      <div class="state">${s.address} · ${s.rssi} dBm</div></div></div>${form}</div>`;
  }).join('')}</div>${free ? '' : `<div class="sub" style="margin:8px 4px">${t('maxBedsHelp')}</div>`}</div>`;
}

async function addBed(mac) {
  const name = $('#addName').value.trim(), pin = $('#addPin').value.trim();
  const free = state.beds.find(b => !b.configured);
  if (!name) { toast(t('giveName')); return; }
  if (!/^\d{4}$/.test(pin)) { toast(t('pinDigits')); return; }
  if (!free) { toast(t('maxBeds')); return; }
  adding = null;
  await run(`bed set ${free.index} ${mac} ${pin} ${name}`);
}

function renameBed(i, old) {
  const name = prompt(t('newName'), old);
  if (name && name.trim() && name.trim() !== old) run(`bed name ${i} ${name.trim()}`);
}

function removeBed(i, name) {
  if (confirm(t('confirmRemove', name))) run(`bed clear ${i}`);
}

async function refresh() {
  try {
    state = JSON.parse(await cmd('json'));
    try { presets = JSON.parse(await cmd('preset list')); } catch (e) { presets = null; }
    const ready = state.beds.filter(b => b.state === 'ready').length;
    const configured = state.beds.filter(b => b.configured).length;
    $('#sys').textContent = configured ? t('bedsConnected', ready, configured) : t('noBeds');
    $('#heap').textContent = Math.round(state.heap / 1024) + ' KB';
    $('#uptime').textContent = state.uptime < 3600 ? Math.floor(state.uptime / 60) + ' min'
      : Math.floor(state.uptime / 3600) + ' ' + t('hours') + ' ' + Math.floor(state.uptime % 3600 / 60) + ' min';
    // Don't redraw while a travel time is being typed
    const focus = document.activeElement;
    if (!$('#beds').contains(focus) || focus.tagName !== 'INPUT')
      $('#beds').innerHTML = state.beds.map(bedSection).join('');
    // Keep an open add form as it is while typing
    if (!adding || !$('#addName')) $('#discovered').innerHTML = discoveredSection();
  } catch (e) { $('#sys').textContent = t('noConnection') + ': ' + e.message; }
}

// Pairing code, QR, commissioning window and paired controllers
async function loadMatter() {
  let m;
  try { m = JSON.parse(await cmd('matter json')); } catch (e) { return; }
  $('#manual').textContent = m.manual.replace(/^(\d{4})(\d{3})(\d{4})$/, '$1-$2-$3') || '–';
  const n = m.qr_size;
  $('#qr').innerHTML = n ? `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="${esc(m.qr)}">
    <rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path fill="#000" d="${m.qr_path}"/></svg>` : '';
  $('#window').textContent = m.window_open ? t('windowOpen') : t('windowClosed');
  $('#openWindow').hidden = m.window_open;
  $('#pairHelp').textContent = m.fabrics.length ? t('pairExtra') : t('pairFirst');
  $('#fabrics').innerHTML = m.fabrics.map(f => `<div class="row"><div class="label">${esc(f.vendor)}
      <div class="sub">Controller ${f.index}${f.label ? ' · ' + esc(f.label) : ''}</div></div>
      <button class="warn" onclick="removeFabric(${f.index}, '${quote(f.vendor)}')">${t('disconnect')}</button></div>`).join('');
  $('#product').textContent = `${m.product} ${m.version}`;
  $('#ids').textContent = `${m.vid} / ${m.pid}`;
  $('#network').textContent = m.network.trim();
}

async function removeFabric(index, vendor) {
  if (!confirm(t('confirmDisconnect', vendor))) return;
  await run(`matter remove ${index}`);
  loadMatter();
}

// The bridge's language wins, so all browsers and Home Assistant agree
async function loadLanguage() {
  try {
    const code = (await cmd('language')).trim();
    if (TEXT[code] && code !== lang) { lang = code; applyLanguage(); refresh(); loadMatter(); }
  } catch (e) {}
}

$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('open'); };
$('#menu').onclick = e => e.stopPropagation();
document.addEventListener('click', () => $('#menu').classList.remove('open'));
$('#reboot').onclick = () => { if (confirm(t('confirmRestart'))) run('reboot'); };
$('#token').onclick = () => { askToken(); refresh(); loadMatter(); };
$('#openWindow').onclick = async () => { await run('matter open'); loadMatter(); };
$('#lang').onchange = async () => {
  lang = $('#lang').value;
  try { localStorage.setItem('octoLang', lang); } catch (e) {}
  applyLanguage();
  try { await cmd('language ' + lang); } catch (e) {}
  refresh();
  loadMatter();
};

applyLanguage();
$('#sys').textContent = t('connecting');
if (!token) askToken();
loadLanguage();
refresh();
loadMatter();
setInterval(() => { if (!document.hidden) refresh(); }, 2000);
setInterval(() => { if (!document.hidden) loadMatter(); }, 15000);
</script>
</body>
</html>
