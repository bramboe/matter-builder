# What a release says about this firmware (tools/release_manifest.py).
# Format 1 of the package description.
name: octo-bed
app: octo_bridge
kind: package
format: 1
title: Octo bed bridge
description: One or two Octo beds over Bluetooth, as Matter covers (head, legs) and a light. Add a second bed on its page and it is picked up by itself.
# The beds take their commands over Bluetooth
requires: [bluetooth]
network: [thread]
# Settings on the device (console "settings json" / "settings set"), the
# same schema the firmware reports; the add-on edits them as YAML
settings:
  beds:
    type: int
    min: 1
    max: 2
    default: 1
    title: Number of beds
