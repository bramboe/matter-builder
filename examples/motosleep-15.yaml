# Summary: MotoSleep-profiel volgens de Bluetooth-naam van het bed.
# Tekens 9 en 10 van de Bluetooth-naam: 15, 25, 35, 45, 65, 85, A2, A3, A4, A5, A6, A7, A8, B2, B3, B4, B5, B6, B7, B8, C2, C3, C4, C5, C6, C7, C8.
# Vereist de meegeleverde Matter Builder-patch.
device:
  name: MotoSleep 15
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 60
  commands:
    - label: Stop
      bytes: "2462"
      times: 5
      gap: 100
    - label: Rug omhoog
      bytes: "244B"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Rug omlaag
      bytes: "244C"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Benen omhoog
      bytes: "244D"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Benen omlaag
      bytes: "244E"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Lendensteun omhoog
      bytes: "2450"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Lendensteun omlaag
      bytes: "2451"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Vlak
      bytes: "244F"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Stop
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Rug omhoog
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Rug omlaag
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Benen omhoog
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Benen omlaag
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Lendensteun omhoog
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Lendensteun omlaag
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Vlak
