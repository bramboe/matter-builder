# Summary: Adjust the backrest and the leg section with Matter buttons. Switch the under-bed light on or off.
# Setup: Use this recipe for a Linak bed with 2 motor assemblies. Check the number of motors on the bed.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Linak 2 motors
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "99FA0001-338A-1024-8A49-009C0215F78A"
  characteristic: "99FA0002-338A-1024-8A49-009C0215F78A"
  write: response
  idle: 60
  commands:
    - label: Backrest up
      bytes: "0B00"
      times: 4
      gap: 200
      finish: "FF00"
      finish_gap: 0
    - label: Backrest down
      bytes: "0A00"
      times: 4
      gap: 200
      finish: "FF00"
      finish_gap: 0
    - label: Legs up
      bytes: "0900"
      times: 4
      gap: 200
      finish: "FF00"
      finish_gap: 0
    - label: Legs down
      bytes: "0800"
      times: 4
      gap: 200
      finish: "FF00"
      finish_gap: 0
    - label: Light on
      bytes: "9200"
    - label: Light off
      bytes: "9300"
    - label: Stop
      bytes: "FF00"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Light on
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Light off
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Stop
