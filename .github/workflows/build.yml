name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Protocol host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/host/run.sh

  spike:
    name: F0 spike firmware (ESP32)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/spike
          idf.py set-target esp32
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: octo-spike-esp32
          path: |
            firmware/spike/build/bootloader/bootloader.bin
            firmware/spike/build/partition_table/partition-table.bin
            firmware/spike/build/octo_spike.bin
            firmware/spike/build/flasher_args.json
