# Summary: Adjust the backrest with Matter buttons. Return the bed to flat, recall one saved position, toggle the under-bed light, and cycle back and leg massage.
# Setup: Check characters 9 and 10 of the bed’s Bluetooth name. Use this recipe for 71.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: MotoSleep 71
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 60
  commands:
    - label: Stop
      bytes: "2462"
      times: 5
      gap: 100
    - label: Backrest up
      bytes: "244B"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Backrest down
      bytes: "244C"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Flat
      bytes: "244F"
    - label: Toggle light
      bytes: "2441"
    - label: Memory 1
      bytes: "2455"
    - label: Back massage
      bytes: "2443"
    - label: Leg massage
      bytes: "2442"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Stop
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest up
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Backrest down
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Flat
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Toggle light
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Memory 1
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Back massage
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Leg massage
