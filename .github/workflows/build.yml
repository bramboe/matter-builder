name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Protocol host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/host/run.sh

# The firmware needs esp-matter (several GB) and is built locally with
# tools/release.sh.

  addon-copies:
    name: Add-on copies equal to the originals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generator and examples
        run: |
          diff -u tools/mb_generate.py ha-addon/matter_builder/src/tools/mb_generate.py
          diff -ru examples ha-addon/matter_builder/src/examples

  addon-image:
    name: Add-on image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # As Home Assistant builds it from the repository: the add-on folder as
      # context, the base image of build.yaml for the architecture
      - name: Build
        run: |
          base=$(python3 -c "import re,sys; t=open('ha-addon/matter_builder/build.yaml').read(); print(re.search(r'${{ matrix.arch }}: (\S+)', t).group(1))")
          docker buildx build --platform ${{ matrix.platform }} --build-arg BUILD_FROM="$base" \
            --load -t matter-builder:${{ matrix.arch }} ha-addon/matter_builder
      - name: Starts and serves its page
        run: |
          mkdir -p /tmp/mbdata
          docker run -d --name mb --platform ${{ matrix.platform }} -e MB_ALLOW_ANY=1 -e MB_PORT=8099 -e MB_DATA=/data \
            -v /tmp/mbdata:/data -p 8099:8099 matter-builder:${{ matrix.arch }}
          # Emulated aarch64 is slow: give it up to five minutes
          for i in $(seq 1 150); do curl -sf -o /dev/null http://127.0.0.1:8099/ && break; sleep 2; done
          docker logs mb 2>&1 | tail -40
          curl -sf http://127.0.0.1:8099/api/state | python3 -c "import json,sys; s=json.load(sys.stdin); print('add-on up:', s['release'] or 'no release yet', '| toolchain', s['toolchain'])"
          docker exec mb python3 -m esptool version

  standalone-image:
    name: Standalone image (Docker, without Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same add-on folder as context, as standalone/docker-compose.yml builds it
      - name: Build with docker compose
        run: |
          cd standalone
          docker compose build
      - name: Starts with its own login
        run: |
          cd standalone
          docker compose up -d
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8099/ && break; sleep 2; done
          docker logs matter-builder 2>&1 | sed 's/setup code: .*/setup code: (hidden)/' | tail -20
          docker logs matter-builder 2>&1 | grep -q "No password yet"
          curl -sf http://127.0.0.1:8099/api/auth | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['standalone'] and not a['password_set'], a; print('auth:', a)"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8099/api/state)
          test "$code" = 401 && echo "api/state without a session: 401"
          docker exec matter-builder python3 -m esptool version
