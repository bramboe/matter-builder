# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat, recall Zero G, and toggle the under-bed light.
# Setup: Use this recipe for remote code ZR60. Match the Bluetooth service and write characteristic listed below to your bed.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Richmat Nordic ZR60
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "6E400001-B5A3-F393-E0A9-E50E24DCCA9E"
  characteristic: "6E400002-B5A3-F393-E0A9-E50E24DCCA9E"
  write: response
  idle: 60
  commands:
    - label: Backrest up
      bytes: "24"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Backrest down
      bytes: "25"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Legs up
      bytes: "26"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Legs down
      bytes: "27"
      times: 6
      gap: 100
      finish: "6E"
      finish_gap: 0
    - label: Stop
      bytes: "6E"
    - label: Flat
      bytes: "31"
      finish: "6E"
      finish_gap: 50
    - label: Zero G
      bytes: "45"
      finish: "6E"
      finish_gap: 50
    - label: Toggle light
      bytes: "3C"
      finish: "6E"
      finish_gap: 50

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Stop
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Flat
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Zero G
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Toggle light
