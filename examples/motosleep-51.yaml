# Summary: MotoSleep-profiel volgens de Bluetooth-naam van het bed.
# Tekens 9 en 10 van de Bluetooth-naam: 51, 52, 53, 54, 56, 57, 58, 61, 91.
# Vereist de meegeleverde Matter Builder-patch.
device:
  name: MotoSleep 51
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 60
  commands:
    - label: Stop
      bytes: "2462"
      times: 5
      gap: 100
    - label: Rug omhoog
      bytes: "244B"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Rug omlaag
      bytes: "244C"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Vlak
      bytes: "244F"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Stop
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Rug omhoog
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Rug omlaag
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Vlak
