# Summary: Solace-bed met korte motorbewegingen.
# Vereist de meegeleverde Matter Builder-patch.
device:
  name: Solace lift en kanteling
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 3600
  commands:
    - label: Rug omhoog
      bytes: "FFFFFFFF05000000039701"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Rug omlaag
      bytes: "FFFFFFFF0500000004D6C3"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Benen omhoog
      bytes: "FFFFFFFF05000000065702"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Benen omlaag
      bytes: "FFFFFFFF050000000796C2"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Lift omhoog
      bytes: "FFFFFFFF05000000211718"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Lift omlaag
      bytes: "FFFFFFFF05000000225719"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Kantel omhoog
      bytes: "FFFFFFFF0500000028D71E"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Kantel omlaag
      bytes: "FFFFFFFF050000002916DE"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Rug omhoog
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Rug omlaag
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Benen omhoog
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Benen omlaag
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Lift omhoog
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Lift omlaag
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Kantel omhoog
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Kantel omlaag
