# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat and toggle the under-bed light.
# Setup: Check characters 9 and 10 of the bed’s Bluetooth name. Use this recipe for 12, 13, 14, 16, 17, 18, 22, 23, 24, 26, 27, 28, 36, 37, 38, 46, 47, and 48.
# Setup: Also use this recipe when the name has no two-character code.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: MotoSleep Basic
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 60
  commands:
    - label: Stop
      bytes: "2462"
      times: 5
      gap: 100
    - label: Backrest up
      bytes: "244B"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Backrest down
      bytes: "244C"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Legs up
      bytes: "244D"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Legs down
      bytes: "244E"
      times: 6
      gap: 100
      finish: "2462"
      finish_gap: 0
    - label: Flat
      bytes: "244F"
    - label: Toggle light
      bytes: "2441"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Stop
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest up
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Backrest down
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs up
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Legs down
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Flat
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Toggle light
