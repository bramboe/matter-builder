# Summary: Keeson KSBT met motoren en presets.
# Vereist de meegeleverde Matter Builder-patch.
device:
  name: Keeson KSBT
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "6E400001-B5A3-F393-E0A9-E50E24DCCA9E"
  characteristic: "6E400002-B5A3-F393-E0A9-E50E24DCCA9E"
  write: response
  idle: 60
  commands:
    - label: Rug omhoog
      bytes: "040200000001"
      times: 4
      gap: 200
      finish: "040200000000"
      finish_gap: 0
    - label: Rug omlaag
      bytes: "040200000002"
      times: 4
      gap: 200
      finish: "040200000000"
      finish_gap: 0
    - label: Benen omhoog
      bytes: "040200000004"
      times: 4
      gap: 200
      finish: "040200000000"
      finish_gap: 0
    - label: Benen omlaag
      bytes: "040200000008"
      times: 4
      gap: 200
      finish: "040200000000"
      finish_gap: 0
    - label: Stop
      bytes: "040200000000"
    - label: Vlak
      bytes: "040208000000"
    - label: Zero G
      bytes: "040200001000"
    - label: Geheugen 1
      bytes: "040200002000"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Rug omhoog
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Rug omlaag
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Benen omhoog
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Benen omlaag
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Stop
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Vlak
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Zero G
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Geheugen 1
