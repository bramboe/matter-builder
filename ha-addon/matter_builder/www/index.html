<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter Builder</title>
<style>
/* Colours, radii and spacing follow the Home Assistant frontend, like the proxies' own page */
:root{--primary:#009ac7;--bg:#f0f0f0;--card:#fff;--fg:#141414;--mute:#727272;--line:#e0e0e0;--fill:#f5f5f5;
--ok:#43a047;--bad:#db4437;--warn:#ff9800;--chip:rgba(0,154,199,.15);--radius:12px}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--fg:#e1e1e1;--mute:#9b9b9b;--line:#2f2f2f;--fill:#2a2a2a;--chip:rgba(0,154,199,.25)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
svg{width:24px;height:24px;fill:currentColor;flex:none}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 8px 0 16px;background:var(--bg)}
header h1{flex:1;margin:0;font-size:20px;font-weight:400}
main{max-width:1000px;margin:0 auto;padding:4px 16px 64px}
.sub{color:var(--mute)}
.section{margin:20px 0 8px}
.section-head{display:flex;align-items:center;gap:8px;margin:0 4px 10px}
.section-head h2{margin:0;font-size:20px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.tile{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tile .icon{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--primary)}
.tile .info{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0;border-top:1px solid var(--line)}
.row .label{flex:1;min-width:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
.dot.ok{background:var(--ok)}
button,a.button{font:inherit;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:var(--radius);background:var(--fill);color:var(--fg);cursor:pointer;text-decoration:none}
button.pri{background:var(--primary);color:#fff}
button.text,a.text{background:none;color:var(--primary);padding:0 8px;min-height:32px}
button.warn{background:none;color:var(--bad)}
button:disabled{opacity:.38;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.field{display:flex;flex-direction:column;min-width:0;background:var(--fill);border-radius:4px 4px 0 0;border-bottom:1px solid var(--mute);padding:6px 12px 4px}
.field span{font-size:12px;color:var(--mute)}
.field input,.field select{font:inherit;border:0;background:none;color:var(--fg);padding:2px 0;outline:none;min-width:0}
.form{display:grid;gap:12px;margin:8px 0}
code,.mono{font:12px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
pre{font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--fill);border-radius:8px;padding:8px;margin:8px 0 0;max-height:360px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
details{border-top:1px solid var(--line);margin-top:10px}
summary{display:flex;align-items:center;min-height:44px;cursor:pointer;font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;margin-right:6px;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg)}
.notice{color:var(--primary);margin-top:8px}
.error{color:var(--bad);margin-top:8px}
.warnText{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .5s}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mute);font-size:13px}
.switch input{width:36px;height:20px;appearance:none;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:18px}
.tabs{display:flex;gap:4px;margin:6px 0}
.tabs button{min-height:32px}
.tabs button.on{background:var(--chip);color:var(--primary)}
.conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
textarea.yaml{width:100%;min-height:260px;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--fill);color:var(--fg);border:0;border-radius:8px;padding:8px}
</style>
</head>
<body>
<header>
  <h1>Matter Builder</h1>
  <label class="switch"><input type="checkbox" id="devMode"><span data-t="devMode"></span></label>
</header>
<main>
<div class="section" id="intro" hidden>
  <div class="card">
    <h3 data-t="introTitle"></h3>
    <div class="sub" data-t="introText"></div>
    <ol class="steps sub">
      <li data-t="introStep1"></li>
      <li data-t="introStep2"></li>
      <li data-t="introStep3"></li>
    </ol>
  </div>
</div>

<div class="section" id="foundSection" hidden>
  <div class="section-head"><h2 data-t="found"></h2></div>
  <div class="grid" id="found"></div>
</div>

<div class="section">
  <div class="section-head"><h2 data-t="proxies"></h2></div>
  <div class="grid">
    <div id="proxies" style="display:contents"></div>
    <div class="card">
      <h3 data-t="addTitle"></h3>
      <div class="sub" data-t="addHelp"></div>
      <form id="linkForm" class="form">
        <label class="field"><span data-t="address"></span><input id="linkHost" autocomplete="off" spellcheck="false" placeholder="1A2B3C4D5E6F7081.local"></label>
        <label class="field"><span data-t="pagePassword"></span><input id="linkPassword" type="password" autocomplete="off"></label>
        <div class="actions" style="margin-top:0"><button class="pri" type="submit" id="linkBtn" data-t="link"></button></div>
      </form>
      <div class="notice" id="linkNotice" hidden></div>
      <div class="error" id="linkError" hidden></div>
    </div>
  </div>
</div>

<div class="section" id="manageSection" hidden>
  <div class="card">
    <div class="tile"><div class="info"><h3 id="manageTitle"></h3><div class="sub" data-t="manageHelp"></div></div>
      <button class="text" id="manageClose" data-t="close"></button></div>
    <div class="tabs"><button id="tabUi" class="on">UI</button><button id="tabYaml">YAML</button></div>
    <div id="manageUi">
      <label class="field"><span data-t="deviceName"></span><input id="mName" maxlength="32" autocomplete="off"></label>
      <div id="mConns"></div>
      <div class="actions"><button class="text" id="mAdd" data-t="addConnection"></button></div>
    </div>
    <div id="manageYaml" hidden><textarea class="yaml" id="mYaml" spellcheck="false"></textarea></div>
    <div class="error" id="mError" hidden></div>
    <div class="notice" id="mNotice" hidden></div>
    <div class="actions"><button class="pri" id="mSave" data-t="saveDraft"></button>
      <button id="mApply" data-t="applyRestart" hidden></button>
      <button class="pri" id="mConfirm" data-t="keep" hidden></button></div>
  </div>
</div>

<div class="section" id="specSection" hidden>
  <div class="section-head"><h2 data-t="ownDevices"></h2></div>
  <div class="grid">
    <div id="specList" style="display:contents"></div>
    <div class="card">
      <h3 id="specEditorTitle" data-t="newDevice"></h3>
      <div class="sub" data-t="specHelp"></div>
      <div class="row"><label class="field" style="flex:1"><span data-t="startFrom"></span><select id="specExample"></select></label></div>
      <textarea class="yaml" id="specText" spellcheck="false"></textarea>
      <div class="error" id="specError" hidden></div>
      <div class="notice" id="specNotice" hidden></div>
      <div class="actions"><button id="specCheck" data-t="check"></button><button class="pri" id="specSave" data-t="save"></button></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-head"><h2 data-t="allProxies"></h2></div>
  <div class="grid">
    <div class="card">
      <h3>Wi-Fi</h3><div class="sub" data-t="bulkWifiHelp"></div>
      <form id="bulkWifi" class="form">
        <label class="field"><span data-t="wifiName"></span><input id="bSsid" maxlength="32" autocomplete="off"></label>
        <label class="field"><span data-t="wifiPassword"></span><input id="bPass" type="password" maxlength="64" autocomplete="off"></label>
        <div class="actions" style="margin-top:0"><button class="pri" type="submit" data-t="sendAll"></button></div>
      </form>
    </div>
    <div class="card">
      <h3 data-t="updateAll"></h3><div class="sub" data-t="updateAllHelp"></div>
      <div class="actions"><button class="pri" id="bUpdate" data-t="updateAll"></button></div>
    </div>
    <div class="card" id="bulkResult" hidden><h3 data-t="result"></h3><div id="bulkRows"></div></div>
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Firmware</h2></div>
  <div class="grid">
    <div class="card">
      <h3 data-t="readyMade"></h3>
      <div id="releases"></div>
      <div class="actions"><button class="text" id="checkReleases" data-t="checkReleases"></button></div>
    </div>
    <div class="card" id="devCard" hidden>
      <h3 data-t="devTitle"></h3>
      <div class="sub" data-t="devHelp"></div>
      <div class="row"><div class="label"><span data-t="host"></span><div class="sub" id="system">–</div></div></div>
      <div class="sub warnText" id="systemAdvice" hidden></div>
      <div class="row"><div class="label">Toolchain<div class="sub" id="toolchainText"></div></div>
        <button id="toolchainBtn" data-t="install"></button></div>
      <div class="actions"><button class="pri" id="buildGenericBtn" data-t="buildGeneric"></button></div>
      <div id="builds" style="margin-top:8px"></div>
    </div>
    <div class="card" id="jobCard" hidden>
      <h3 id="jobTitle"></h3>
      <div class="sub" id="jobState"></div>
      <div class="bar" id="jobBar" hidden><i id="jobBarFill" style="width:0"></i></div>
      <div class="sub" id="jobStep" style="margin-top:4px"></div>
      <details id="jobDetails"><summary data-t="log"></summary><pre id="jobLog"></pre></details>
    </div>
  </div>
</div>
</main>
<script>
// All URLs are relative: Home Assistant serves the page under its ingress path
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// Only when it changed: the page refreshes every few seconds, and a USB
// install's progress and checkboxes must survive that
function setHtml(el, html) {
  if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
}

const TEXT = {
    devMode: 'Developer mode', introTitle: 'Welcome',
    introText: 'Matter Builder sets up ESP32 devices that work as standard Matter devices in Home Assistant, Apple Home and Google Home, over Wi-Fi or Thread. Every device keeps working without Home Assistant and has a settings page of its own.',
    introStep1: 'Put firmware on an ESP32 (ready-made below).', introStep2: 'Set it up on its own page: password, Wi-Fi, Thread and what is connected.',
    introStep3: 'Link it here, so this add-on can show and update it.',
    proxies: 'Proxies', addTitle: 'Link a proxy',
    addHelp: 'The address of the proxy’s settings page and its password. The add-on gets a key of its own; the password is not stored.',
    address: 'Address', pagePassword: 'Password of the page', link: 'Link', wrongPassword: 'Wrong password.',
    pressBoot: s => `Now press the proxy’s BOOT button briefly (${s} s left). Button out of reach? Switch its power off and on three times.`,
    linked: 'Linked.', notLinked: 'Not linked: the BOOT button was not pressed in time. Try again.',
    found: 'Found', foundHelp: 'Found on the network, not linked yet.', linkThis: 'Link',
    keyRejected: 'The proxy no longer accepts the add-on’s key (revoked, or the proxy was reset).', linkAgain: 'Link again',
    checking: 'Checking…', unreachable: 'Not reachable', firmware: 'Firmware', network: 'Network', connected: 'connected',
    key: 'Key of the add-on', show: 'Show', hide: 'Hide', copy: 'Copy', update: 'Update', openPage: 'Open settings', rename: 'Rename', forget: 'Forget',
    confirmUpdate: f => `Install ${f}? The proxy moves to Wi-Fi for a few minutes; what is connected to it is unavailable meanwhile.`,
    confirmForget: 'Forget this proxy? Also revoke its key on the proxy’s page (Programs with access).', name: 'Name',
    manageHelp: 'Connections are saved as a draft on the device; apply restarts it, then keep them within 2 minutes.', close: 'Close',
    deviceName: 'Device name', addConnection: 'Add connection', saveDraft: 'Save', applyRestart: 'Apply (restart)', keep: 'Keep',
    manage: 'Connections', slot: 'Connection', type: 'Type', pin: 'Pin', scl: 'SCL', inverted: 'Inverted', remove: 'Remove',
    types: {relay: 'Relay', led: 'LED', button: 'Push button', contact: 'Contact', motion: 'Motion sensor', sht4x: 'SHT4x'},
    saved: 'Saved as draft.', unchanged: 'Nothing changed.', applying: 'Restarting with the new connections…',
    trialLeft: s => `On trial: keep within ${s} s.`, kept: 'Kept.', yamlError: e => `YAML: ${e}`, full: 'All 8 connections are in use.',
    allProxies: 'All proxies', bulkWifiHelp: 'The network for configuration mode (updates, first setup) of every linked proxy.',
    wifiName: 'Network', wifiPassword: 'Password', sendAll: 'Send to all',
    updateAll: 'Update all', updateAllHelp: 'Every proxy to the newest firmware of its own kind, one after the other; stops at the first problem.',
    result: 'Result',
    ownDevices: 'Own devices', save: 'Save', newDevice: 'New device', specHelp: 'Describe what is built: name, application and, for a generic device, its connections. Wi-Fi, Thread and passwords are set on the device itself.',
    startFrom: 'Start from', check: 'Check', specOk: s => `Valid: ${s.name} ${s.version} (${s.app}).`, specSaved: 'Saved.', edit: 'Edit', del: 'Delete',
    buildThis: 'Build', updateFile: 'Update file', factoryFile: 'For a new ESP32 (USB)', confirmDelete: n => `Delete the spec “${n}”? Built files stay.`,
    flashHelp: 'Connect the ESP32 with USB to this computer, then install. Afterwards join its setup network and link it here. Needs Chrome or Edge, and Home Assistant over HTTPS.',
    installUsb: 'Install via USB', backupFirst: 'First save a backup of the whole flash', noSerial: 'This browser cannot use USB here: use Chrome or Edge, and open Home Assistant over HTTPS.',
    usbConnecting: 'Connecting…', usbChip: c => `Found: ${c}`, wrongChip: c => `This is a ${c}, not an ESP32-C6.`, usbBackup: p => `Backup: ${p} %`,
    usbWriting: p => `Installing: ${p} %`, usbDone: 'Installed. The ESP32 restarts and opens its setup network.',
    buildingSpec: n => `Building ${n}`,
    readyMade: 'Ready-made firmware', checkReleases: 'Check now', signedRelease: r => `Release ${r}, signature checked.`,
    noReleases: 'No releases yet. Signed, ready-made firmware appears here once the project publishes it. In developer mode you can build it yourself.',
    devTitle: 'Developer mode', devHelp: 'Builds firmware in Home Assistant with fixed versions of ESP-IDF (v5.5.5) and esp-matter (release/v1.6). Nothing personal is built in.',
    host: 'This host', cores: 'cores', memory: 'GB memory', disk: 'GB free',
    fewCores: 'Few cores or little memory: the first build takes an hour or more. More cores for the Home Assistant machine help most (about 1.5 GB memory per core).',
    toolchainReady: 'Ready', toolchainMissing: 'Not installed: about 6 GB, 15 minutes or more. Not included in backups.',
    install: 'Install', buildGeneric: 'Build generic device (ESP32-C6)', ownBuilds: 'Own builds',
    apps: {mb_generic: 'Generic device'}, nothingConnected: 'Nothing connected yet',
    log: 'Log', running: t => `Running since ${t}`, done: 'Done.', failed: 'Failed: see the log.', step: (d, t) => `Step ${d} of ${t}`,
    jobs: {toolchain: 'Installing the toolchain', all: 'Updating all proxies', build: () => 'Building the generic device', update: n => `Updating ${n}`},
};
function t(key, ...args) { const v = TEXT[key]; return typeof v === 'function' ? v(...args) : v; }
function applyTexts() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
}

let state = null, statuses = {}, shownTokens = {}, chosen = {};

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
const date = seconds => new Date(seconds * 1000).toLocaleString('en', {dateStyle: 'medium', timeStyle: 'short'});
const gb = bytes => (bytes / 2 ** 30).toFixed(bytes < 10 * 2 ** 30 ? 1 : 0);

const CHIP = '<svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m1 3v10h10V7H7m3 3h4v4h-4v-4M8 1h2v2H8V1m3 0h2v2h-2V1m3 0h2v2h-2V1M8 21h2v2H8v-2m3 0h2v2h-2v-2m3 0h2v2h-2v-2M1 8h2v2H1V8m0 3h2v2H1v-2m0 3h2v2H1v-2m20-6h2v2h-2V8m0 3h2v2h-2v-2m0 3h2v2h-2v-2"/></svg>';

// "running: app1 @0x320000: mb_generic 0.1.1 (…)" and "thread: attached, role child, …"
function summary(s) {
  if (!s) return `<div class="sub">${t('checking')}</div>`;
  if (!s.ok && s.auth) return `<div class="sub warnText">${t('keyRejected')}</div>`;
  if (!s.ok) return `<div class="sub"><span class="dot"></span>${t('unreachable')}: ${esc(s.error)}</div>`;
  const lines = s.system.split('\n');
  const [, app, version] = (lines[0] || '').match(/: (\S+) (\S+) \(/) || [null, '', '?'];
  const net = lines.find(l => /^(thread|wifi|configuration mode)/.test(l)) || '';
  const beds = s.beds.split('\n').map(l => l.match(/bed \d '([^']*)' \S+: (\w+)/)).filter(Boolean)
    .map(m => `<div class="row"><div class="label">${esc(m[1])}</div><div class="sub"><span class="dot ${m[2] === 'ready' ? 'ok' : ''}"></span>${m[2] === 'ready' ? t('connected') : esc(m[2])}</div></div>`).join('');
  const io = s.io ? s.io.slots.filter(c => c.type !== 'none').map(c => `<div class="row"><div class="label">${esc(c.name)}</div>
      <div class="sub">${esc(c.type)}${c.temperature !== undefined ? ` · ${c.temperature.toFixed(1)} °C · ${c.humidity.toFixed(0)} %` : ''}</div></div>`).join('')
    || `<div class="row"><div class="sub">${t('nothingConnected')}</div></div>` : '';
  return `<div class="row"><div class="label">${t('firmware')}</div><div>${esc((TEXT.apps[app] || app) + ' ' + version)}</div></div>
    <div class="row"><div class="label">${t('network')}</div><div class="sub">${esc(net.split(',').slice(0, 2).join(','))}</div></div>${beds}${io}`;
}

// Only firmware of the proxy's own application (mb_generic-…)
function firmwareFiles(p) {
  const files = [...state.releases.map(r => r.file), ...(state.settings.dev_mode ? state.builds.map(b => b.file) : [])];
  return p.app ? files.filter(f => f.startsWith(p.app + '-')) : files;
}

function pageUrl(host) {
  const h = host.trim();
  return 'http://' + (h.split(':').length > 2 && !h.startsWith('[') ? `[${h}]` : h) + '/';
}

function proxyCard(p) {
  const s = statuses[p.id];
  const files = firmwareFiles(p);
  const token = shownTokens[p.id];
  return `<div class="card">
    <div class="tile"><div class="icon">${CHIP}</div><div class="info"><h3>${esc(p.name)}</h3>
      <div class="sub mono">${esc(p.host)}</div></div><span class="dot ${s && s.ok ? 'ok' : ''}"></span></div>
    ${summary(s)}
    <div class="row"><div class="label">${t('key')}<div class="sub mono">${token ? esc(token) : '••••••••••••••••'}</div></div>
      <button class="text" onclick="toggleToken('${p.id}')">${token ? t('hide') : t('show')}</button>
      ${token ? `<button class="text" onclick="copyToken('${p.id}')">${t('copy')}</button>` : ''}</div>
    ${files.length ? `<div class="row"><label class="field" style="flex:1"><span>${t('firmware')}</span>
      <select id="fw-${p.id}" onchange="chosen['${p.id}'] = this.value">${files.map(f => `<option ${chosen[p.id] === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></label>
      <button class="pri" onclick="updateProxy('${p.id}')" ${state.job.running ? 'disabled' : ''}>${t('update')}</button></div>` : ''}
    ${s && s.auth ? `<div class="actions"><button class="pri" onclick="prefillLink('${esc(p.host)}')">${t('linkAgain')}</button></div>` : ''}
    <div class="actions">${s && s.io ? `<button class="pri" onclick="openManage('${p.id}')">${t('manage')}</button>` : ''}
      <a class="button text" href="${esc(pageUrl(p.host))}" target="_blank" rel="noopener">${t('openPage')} ↗</a>
      <button class="text" onclick="renameProxy('${p.id}')">${t('rename')}</button>
      <button class="warn" onclick="forgetProxy('${p.id}')">${t('forget')}</button></div>
  </div>`;
}

const appName = app => app.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());

function foundCard(d) {
  return `<div class="card"><div class="tile"><div class="icon">${CHIP}</div><div class="info">
      <h3>${esc(appName(d.app))}</h3><div class="sub mono">${esc(d.host)}</div></div></div>
    <div class="sub">${t('foundHelp')} ${t('firmware')} ${esc(d.version)}.</div>
    <div class="actions"><button class="pri" onclick="prefillLink('${esc(d.address)}')">${t('linkThis')}</button></div></div>`;
}

// Fills in the address and asks for the password: the rest is the BOOT button
function prefillLink(host) {
  $('#linkHost').value = host;
  $('#linkForm').scrollIntoView({behavior: 'smooth', block: 'center'});
  $('#linkPassword').focus();
}

// A ready-made firmware from the signed release: what it is (its package
// description), and when the release has a factory image, installing it on a
// new ESP32 over USB
function releaseRow(r) {
  const pkg = (state.packages || []).find(p => p.app === r.app);
  const title = pkg ? pkg.title : (TEXT.apps[r.app] || r.app);
  const about = pkg ? pkg.description : '';

}

// ---------------------------------------------------------------- manage
// A generic proxy's connections, as a form (UI) or as YAML. Saving sends the
// differences to the device's draft ("io set" / "io clear"); applying
// restarts it with the draft as a trial, which is then kept.
const TYPES = ['relay', 'led', 'button', 'contact', 'motion', 'sht4x'];
let managed = null;  // {id, io}
let editRows = [];   // [{slot, type, pin, pin2, inverted, name}]

async function proxyCommand(id, line) {
  const r = await api(`api/proxy/${id}/command`, {line});
  if (r.error) throw new Error(r.error);
  return r.text;
}

function rowsFromIo(io) {
  return io.draft.filter(d => d.type !== 'none')
    .map(d => ({slot: d.index, type: d.type, pin: d.pin, pin2: d.pin2, inverted: d.inverted, name: d.name}));
}

function toYaml(name, rows) {
  const lines = [`name: ${name}`, 'connections:'];
  for (const r of rows) {
    lines.push(`  - slot: ${r.slot}`, `    type: ${r.type}`, `    pin: ${r.pin}`);
    if (r.type === 'sht4x') lines.push(`    scl: ${r.pin2}`);
    if (r.inverted) lines.push('    inverted: true');
    lines.push(`    name: ${r.name}`);
  }
  return lines.join('\n') + '\n';
}

function fromYaml(text) {
  let name = null;
  const rows = [];
  let current = null;
  for (const raw of text.split('\n')) {
    const line = raw.replace(/#.*$/, '').trimEnd();
    if (!line.trim()) continue;
    const item = line.match(/^\s*-\s+(.*)$/);
    const body = item ? item[1] : line.trim();
    const kv = body.match(/^([a-z0-9_]+)\s*:\s*(.*)$/i);
    if (!kv) throw new Error(`cannot read “${line.trim()}”`);
    const key = kv[1], value = kv[2].replace(/^["']|["']$/g, '');
    if (item) { current = {slot: null, type: '', pin: null, pin2: 0, inverted: false, name: ''}; rows.push(current); }
    if (!line.startsWith(' ') && !item) {
      if (key === 'name') name = value;
      else if (key !== 'connections') throw new Error(`unknown “${key}”`);
      continue;
    }
    if (!current) throw new Error(`“${key}” outside a connection`);
    if (key === 'slot') current.slot = +value;
    else if (key === 'type') current.type = value;
    else if (key === 'pin') current.pin = +value;
    else if (key === 'scl') current.pin2 = +value;
    else if (key === 'inverted') current.inverted = value === 'true';
    else if (key === 'name') current.name = value;
    else throw new Error(`unknown “${key}”`);
  }
  for (const r of rows) {
    if (!(r.slot >= 0 && r.slot <= 7)) throw new Error('slot must be 0-7');
    if (!TYPES.includes(r.type)) throw new Error(`type “${r.type}”`);
    if (!managed.io.pins.includes(r.pin) || (r.type === 'sht4x' && !managed.io.pins.includes(r.pin2))) throw new Error(`pin of slot ${r.slot}`);
  }
  if (new Set(rows.map(r => r.slot)).size !== rows.length) throw new Error('a slot appears twice');
  return {name, rows};
}

function renderRows() {
  const pins = managed.io.pins.map(p => `<option value="${p}">GPIO ${p}</option>`).join('');
  $('#mConns').innerHTML = editRows.map((r, i) => `<div class="conn">
      <label class="field"><span>${t('slot')}</span><input value="${r.slot}" disabled></label>
      <label class="field"><span>${t('type')}</span><select onchange="editRows[${i}].type=this.value;renderRows()">
        ${TYPES.map(x => `<option value="${x}" ${x === r.type ? 'selected' : ''}>${esc(TEXT.types[x])}</option>`).join('')}</select></label>
      <label class="field"><span>${r.type === 'sht4x' ? 'SDA' : t('pin')}</span><select onchange="editRows[${i}].pin=+this.value">${pins.replace(`value="${r.pin}"`, `value="${r.pin}" selected`)}</select></label>
      ${r.type === 'sht4x' ? `<label class="field"><span>${t('scl')}</span><select onchange="editRows[${i}].pin2=+this.value">${pins.replace(`value="${r.pin2}"`, `value="${r.pin2}" selected`)}</select></label>` : ''}
      <label class="field"><span>${t('name')}</span><input maxlength="23" value="${esc(r.name)}" oninput="editRows[${i}].name=this.value"></label>
      <label class="row" style="min-height:40px;border:0"><input type="checkbox" ${r.inverted ? 'checked' : ''} onchange="editRows[${i}].inverted=this.checked"><span class="sub">${t('inverted')}</span></label>
      <button class="warn" onclick="editRows.splice(${i},1);renderRows()">${t('remove')}</button></div>`).join('');
  $('#mAdd').disabled = editRows.length >= 8;
}

function showManageState() {
  const io = managed.io;
  $('#mApply').hidden = !io.changed || io.trial > 0;
  $('#mConfirm').hidden = !(io.trial > 0);
  $('#mNotice').hidden = !(io.trial > 0);
  if (io.trial > 0) $('#mNotice').textContent = t('trialLeft', io.trial);
}

async function openManage(id) {
  const p = state.proxies.find(x => x.id === id);
  managed = {id, io: JSON.parse(await proxyCommand(id, 'io json')).io};
  editRows = rowsFromIo(managed.io);
  $('#manageTitle').textContent = `${t('manage')}: ${p.name}`;
  $('#mName').value = managed.io.name;
  $('#mYaml').value = toYaml(managed.io.name, editRows);
  $('#mError').hidden = true;
  renderRows();
  showManageState();
  $('#manageSection').hidden = false;
  $('#manageSection').scrollIntoView({behavior: 'smooth'});
}

function setTab(yaml) {
  if (yaml) $('#mYaml').value = toYaml($('#mName').value, editRows);
  else {
    try { const parsed = fromYaml($('#mYaml').value); editRows = parsed.rows; if (parsed.name) $('#mName').value = parsed.name; renderRows(); }
    catch (e) { $('#mError').textContent = t('yamlError', e.message); $('#mError').hidden = false; return; }
  }
  $('#mError').hidden = true;
  $('#manageUi').hidden = yaml;
  $('#manageYaml').hidden = !yaml;
  $('#tabUi').classList.toggle('on', !yaml);
  $('#tabYaml').classList.toggle('on', yaml);
}

async function saveManage() {
  $('#mError').hidden = true;
  let name = $('#mName').value.trim(), rows = editRows;
  if (!$('#manageYaml').hidden) {
    try { const parsed = fromYaml($('#mYaml').value); rows = parsed.rows; if (parsed.name) name = parsed.name; }
    catch (e) { $('#mError').textContent = t('yamlError', e.message); $('#mError').hidden = false; return; }
  }
  const before = new Map(rowsFromIo(managed.io).map(r => [r.slot, r]));
  const lines = [];
  for (const r of rows) {
    const old = before.get(r.slot);
    before.delete(r.slot);
    if (old && JSON.stringify(old) === JSON.stringify(r)) continue;
    const pins = r.type === 'sht4x' ? `${r.pin} ${r.pin2}` : `${r.pin}`;
    lines.push(`io set ${r.slot} ${r.type} ${pins}${r.inverted ? ' inverted' : ''} ${(r.name || TEXT.types[r.type]).trim().replace(/\s+/g, ' ')}`);
  }
  for (const slot of before.keys()) lines.push(`io clear ${slot}`);
  if (name && name !== managed.io.name) lines.push(`name ${name}`);
  try {
    for (const line of lines) {
      const reply = await proxyCommand(managed.id, line);
      if (!reply.startsWith('ok')) throw new Error(reply.trim());
    }
  } catch (e) { $('#mError').textContent = e.message; $('#mError').hidden = false; return; }
  managed.io = JSON.parse(await proxyCommand(managed.id, 'io json')).io;
  editRows = rowsFromIo(managed.io);
  renderRows();
  $('#mYaml').value = toYaml(managed.io.name, editRows);
  showManageState();
  toastNotice(lines.length ? t('saved') : t('unchanged'));
}

function toastNotice(text) { $('#mNotice').textContent = text; $('#mNotice').hidden = false; }

// After "apply" the proxy restarts: wait until it answers, then show the trial
async function applyManage() {
  try { await proxyCommand(managed.id, 'io apply'); } catch (e) {}
  toastNotice(t('applying'));
  $('#mApply').hidden = true;
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try { managed.io = JSON.parse(await proxyCommand(managed.id, 'io json')).io; if (managed.io.trial > 0) break; } catch (e) {}
  }
  showManageState();
}

$('#tabUi').onclick = () => setTab(false);
$('#tabYaml').onclick = () => setTab(true);
$('#manageClose').onclick = () => { $('#manageSection').hidden = true; managed = null; };
$('#mAdd').onclick = () => {
  const used = new Set(editRows.map(r => r.slot));
  const slot = [0, 1, 2, 3, 4, 5, 6, 7].find(s => !used.has(s));
  if (slot === undefined) return;
  editRows.push({slot, type: 'relay', pin: managed.io.pins[0], pin2: managed.io.pins[1], inverted: false, name: ''});
  renderRows();
};
$('#mSave').onclick = saveManage;
$('#mApply').onclick = applyManage;
$('#mConfirm').onclick = async () => {
  await proxyCommand(managed.id, 'io confirm');
  managed.io = JSON.parse(await proxyCommand(managed.id, 'io json')).io;

  toastNotice(t('kept'));
};

// ---------------------------------------------------------------- own devices
// Specs (YAML) kept in the add-on; built in developer mode into an update
// file and an image for a new ESP32
let specs = null, exampleTexts = {};

function specCard(sp) {
  const latest = list => list.length ? list[list.length - 1] : null;
  const fw = latest(sp.firmware), factory = latest(sp.factory);
  return `<div class="card"><h3>${esc(sp.name)}</h3><div class="sub">${esc(sp.app)} · ${esc(sp.version)}</div>
    ${sp.error ? `<div class="error">${esc(sp.error)}</div>` : ''}
    ${fw ? `<div class="row"><div class="label">${t('updateFile')}<div class="sub mono">${esc(fw)}</div></div><a class="button text" href="api/download/${encodeURIComponent(fw)}">↓</a></div>` : ''}
    ${factory ? `<div class="row"><div class="label">${t('factoryFile')}<div class="sub mono">${esc(factory)}</div></div><a class="button text" href="api/download/${encodeURIComponent(factory)}">↓</a></div>
      <label class="row" style="min-height:36px;border:0"><input type="checkbox" id="backup-${sp.slug}" checked><span class="sub">${t('backupFirst')}</span></label>
      <div class="actions"><button class="pri" onclick="flashUsb('${esc(factory)}', '${sp.slug}')">${t('installUsb')}</button></div>
      <div class="sub" id="usb-${sp.slug}">${t('flashHelp')}</div>` : ''}
    <div class="actions"><button class="pri" onclick="buildSpec('${sp.slug}')" ${sp.error || !state.toolchain || state.job.running ? 'disabled' : ''}>${t('buildThis')}</button>
      <button class="text" onclick="editSpec('${sp.slug}')">${t('edit')}</button>
      <button class="warn" onclick="deleteSpec('${sp.slug}', '${esc(sp.name)}')">${t('del')}</button></div></div>`;
}

async function loadSpecs() {
  const r = await api('api/specs');
  specs = r.specs;
  if (!Object.keys(exampleTexts).length) {
    exampleTexts = r.examples;
    $('#specExample').innerHTML = Object.keys(exampleTexts).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    if (!$('#specText').value) $('#specText').value = Object.values(exampleTexts)[0] || '';
  }
  $('#specList').innerHTML = specs.map(specCard).join('');
}

function specMessage(error, notice) {
  $('#specError').hidden = !error; $('#specError').textContent = error || '';
  $('#specNotice').hidden = !notice; $('#specNotice').textContent = notice || '';
}

async function postSpec(checkOnly) {
  const r = await fetch('api/specs', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: $('#specText').value, check_only: checkOnly})}).then(x => x.json());
  if (r.error) { specMessage(r.error); return; }
  specMessage(null, checkOnly ? t('specOk', r.spec) : t('specSaved'));
  if (!checkOnly) loadSpecs();
}

async function editSpec(slug) {
  $('#specText').value = (await api(`api/specs/${slug}`)).text;
  specMessage();
  $('#specText').scrollIntoView({behavior: 'smooth', block: 'center'});
}
async function buildSpec(slug) { await api(`api/specs/${slug}/build`, {}); refresh(); }
async function deleteSpec(slug, name) {
  if (!confirm(t('confirmDelete', name))) return;
  await api(`api/specs/${slug}/delete`, {});
  loadSpecs();
}
$('#specExample').onchange = () => { $('#specText').value = exampleTexts[$('#specExample').value] || ''; specMessage(); };
$('#specCheck').onclick = () => postSpec(true);
$('#specSave').onclick = () => postSpec(false);


// Install via USB in the browser (Web Serial, esptool-js 0.7.0 shipped with
// the add-on): optional full-flash backup first, then the factory image at 0
async function flashUsb(file, slug) {
  const status = $(`#usb-${slug}`);
  const say = text => { status.textContent = text; };
  if (!('serial' in navigator) || !window.isSecureContext) { say(t('noSerial')); return; }
  let transport = null;
  try {
    const {ESPLoader, Transport} = await import('./esptool.js');
    const port = await navigator.serial.requestPort();
    transport = new Transport(port, false);
    say(t('usbConnecting'));
    const quiet = {clean() {}, writeLine() {}, write() {}};
    const loader = new ESPLoader({transport, baudrate: 460800, terminal: quiet});
    const chip = await loader.main();
    if (!/ESP32-C6/i.test(chip)) { say(t('wrongChip', chip)); return; }
    say(t('usbChip', chip));
    if ($(`#backup-${slug}`).checked) {
      const size = loader.flashSizeBytes((await loader.detectFlashSize()) || '8MB');
      const backup = await loader.readFlash(0, size, (_, got) => say(t('usbBackup', Math.round(100 * got / size))));
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([backup]));
      link.download = `backup-${slug}-${new Date().toISOString().slice(0, 10)}.bin`;
      link.click();
    }
    const data = new Uint8Array(await (await fetch(`api/download/${encodeURIComponent(file)}`)).arrayBuffer());
    await loader.writeFlash({fileArray: [{data, address: 0}], flashMode: 'keep', flashFreq: 'keep', flashSize: 'keep',
      eraseAll: false, compress: true, reportProgress: (_, written, total) => say(t('usbWriting', Math.round(100 * written / total)))});
    await loader.after('hard_reset');
    say(t('usbDone'));
  } catch (e) {
    say(e.message || String(e));
  } finally {
    if (transport) try { await transport.disconnect(); } catch (e) {}
  }
}
