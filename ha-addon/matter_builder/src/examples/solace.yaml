# Summary: Solace-bed met korte motorbewegingen.
# Vereist de meegeleverde Matter Builder-patch.
device:
  name: Solace
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 3600
  commands:
    - label: Rug omhoog
      bytes: "FFFFFFFF05000000039701"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Rug omlaag
      bytes: "FFFFFFFF0500000004D6C3"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Benen omhoog
      bytes: "FFFFFFFF05000000065702"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Benen omlaag
      bytes: "FFFFFFFF050000000796C2"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Alles vlak
      bytes: "FFFFFFFF050000002A56DF"
    - label: Zero G
      bytes: "FFFFFFFF05000000091706"
    - label: Geheugen 1
      bytes: "FFFFFFFF050000A10A2E97"
    - label: Stop
      bytes: "FFFFFFFF0500000000D700"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Rug omhoog
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Rug omlaag
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Benen omhoog
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Benen omlaag
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Alles vlak
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Zero G
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Geheugen 1
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Stop
