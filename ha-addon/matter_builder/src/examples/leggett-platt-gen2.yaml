# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat, recall the anti-snore preset, and recall Relax.
# Setup: Use this recipe for a Gen2 controller with product ID 5 or 7.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Leggett Platt Gen2
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "45E25100-3171-4CFC-AE89-1D83CF8D8071"
  characteristic: "45E25101-3171-4CFC-AE89-1D83CF8D8071"
  write: response
  idle: 3600
  commands:
    - label: Backrest up
      bytes: "4D20303A3A313233"
      times: 4
      gap: 200
      finish: "4D203A3A30313233"
      finish_gap: 0
    - label: Backrest down
      bytes: "4D203A303A313233"
      times: 4
      gap: 200
      finish: "4D203A3A30313233"
      finish_gap: 0
    - label: Legs up
      bytes: "4D20313A3A303233"
      times: 4
      gap: 200
      finish: "4D203A3A30313233"
      finish_gap: 0
    - label: Legs down
      bytes: "4D203A313A303233"
      times: 4
      gap: 200
      finish: "4D203A3A30313233"
      finish_gap: 0
    - label: Stop
      bytes: "53544F50"
    - label: Flat
      bytes: "4D454D2030"
    - label: Anti-snore
      bytes: "534E52"
    - label: Relax
      bytes: "4D454D2034"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Stop
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Flat
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Anti-snore
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Relax
