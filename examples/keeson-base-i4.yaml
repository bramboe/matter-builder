# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat, recall Zero G, and recall one saved position.
# Setup: Identify the controller by a Bluetooth name beginning with base-i4.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Keeson Base-i4
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE5"
  characteristic: "FFE9"
  write: response
  idle: 60
  commands:
    - label: Backrest up
      bytes: "E5FE160100000005"
      times: 4
      gap: 200
      finish: "E5FE160000000006"
      finish_gap: 0
    - label: Backrest down
      bytes: "E5FE160200000004"
      times: 4
      gap: 200
      finish: "E5FE160000000006"
      finish_gap: 0
    - label: Legs up
      bytes: "E5FE160400000002"
      times: 4
      gap: 200
      finish: "E5FE160000000006"
      finish_gap: 0
    - label: Legs down
      bytes: "E5FE1608000000FE"
      times: 4
      gap: 200
      finish: "E5FE160000000006"
      finish_gap: 0
    - label: Stop
      bytes: "E5FE160000000006"
    - label: Flat
      bytes: "E5FE1600000008FE"
    - label: Zero G
      bytes: "E5FE1600100000F6"
    - label: Memory 1
      bytes: "E5FE1600200000E6"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Stop
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Flat
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Zero G
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Memory 1
