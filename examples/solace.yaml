# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat, recall Zero G, and recall one saved position.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Solace
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "FFE0"
  characteristic: "FFE1"
  write: response
  idle: 3600
  commands:
    - label: Backrest up
      bytes: "FFFFFFFF05000000039701"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Backrest down
      bytes: "FFFFFFFF0500000004D6C3"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Legs up
      bytes: "FFFFFFFF05000000065702"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: Legs down
      bytes: "FFFFFFFF050000000796C2"
      finish: "FFFFFFFF0500000000D700"
      finish_gap: 950
    - label: All flat
      bytes: "FFFFFFFF050000002A56DF"
    - label: Zero G
      bytes: "FFFFFFFF05000000091706"
    - label: Memory 1
      bytes: "FFFFFFFF050000A10A2E97"
    - label: Stop
      bytes: "FFFFFFFF0500000000D700"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: All flat
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Zero G
  - slot: 6
    type: ble_command
    number: 7
    group: Bed
    name: Memory 1
  - slot: 7
    type: ble_command
    number: 8
    group: Bed
    name: Stop
