name: Release

# Ready-made firmware for users who do not build: the same toolchain and
# scripts as the Home Assistant add-on's developer mode (ha-addon/matter_builder),
# so a release can be rebuilt there and compared. A tag "v<version>" builds
# the Octo bridge and the generic device for the ESP32-C6, writes a manifest
# with SHA-256 hashes, signs it (secret MB_SIGNING_KEY, ECDSA P-256) and
# publishes everything as a GitHub release. The add-on checks the signature
# against ha-addon/matter_builder/release-key.pem before it installs anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    env:
      # Outside the checkout: build.sh copies the sources (the checkout) into MB_DATA
      MB_DATA: /mb
      MB_SRC: ${{ github.workspace }}
      ESP_MATTER_COMMIT: fe1efc6cdf62f19b5ca44213900333a6aad7a8b2
      IDF_PYTHON_ENV_PATH: /mb/toolchain/python_env
    steps:
      - uses: actions/checkout@v4

      - name: Build prerequisites (as in the add-on's image)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libffi-dev libssl-dev \
            libdbus-1-dev libglib2.0-dev libavahi-client-dev libgirepository1.0-dev libcairo2-dev \
            libreadline-dev python3-dev python3-venv unzip openssl gh

      - name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: /mb/toolchain
          key: toolchain-${{ env.ESP_MATTER_COMMIT }}

      - name: Toolchain
        shell: bash
        run: |
          if [ ! -f "$MB_DATA/toolchain/ready-$ESP_MATTER_COMMIT" ]; then
            bash ha-addon/matter_builder/toolchain.sh
          fi

      - name: Build
        shell: bash
        run: |
          bash ha-addon/matter_builder/build.sh bridge
          bash ha-addon/matter_builder/build.sh generic

      - name: Manifest and signature
        shell: bash
        env:
          MB_SIGNING_KEY: ${{ secrets.MB_SIGNING_KEY }}
        run: python3 tools/release_manifest.py "$MB_DATA/firmware" "${GITHUB_REF_NAME}"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Signed firmware for the ESP32-C6" \
            "$MB_DATA"/firmware/*.bin "$MB_DATA/firmware/manifest.json" "$MB_DATA/firmware/manifest.json.sig"
