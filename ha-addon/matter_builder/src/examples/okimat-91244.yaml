# Summary: Adjust the backrest and the leg section with Matter buttons. Return the bed to flat and toggle the under-bed light.
# Setup: Use this recipe for a RF-FLASHLINE remote with code 91244. The ESP32 pairs over Bluetooth before it discovers the control characteristic.
# Setup: Use generic ESP32-C6 firmware 0.1.32 or later.
device:
  name: Okimat 91244
  app: generic
  board: esp32-c6

bluetooth_device:
  service: "62741523-52F9-8864-B1AB-3B3A8D65950B"
  characteristic: "62741525-52F9-8864-B1AB-3B3A8D65950B"
  write: response
  idle: 3600
  setup:
    - type: pair
      ms: 10000
    - type: discover
      ms: 5000
  commands:
    - label: Backrest up
      bytes: "040200000001"
      times: 5
      gap: 100
    - label: Backrest down
      bytes: "040200000002"
      times: 5
      gap: 100
    - label: Legs up
      bytes: "040200000004"
      times: 5
      gap: 100
    - label: Legs down
      bytes: "040200000008"
      times: 5
      gap: 100
    - label: Flat
      bytes: "0402100000AA"
      times: 50
      gap: 200
    - label: Toggle light
      bytes: "040200020000"

connections:
  - slot: 0
    type: ble_command
    number: 1
    group: Bed
    name: Backrest up
  - slot: 1
    type: ble_command
    number: 2
    group: Bed
    name: Backrest down
  - slot: 2
    type: ble_command
    number: 3
    group: Bed
    name: Legs up
  - slot: 3
    type: ble_command
    number: 4
    group: Bed
    name: Legs down
  - slot: 4
    type: ble_command
    number: 5
    group: Bed
    name: Flat
  - slot: 5
    type: ble_command
    number: 6
    group: Bed
    name: Toggle light
