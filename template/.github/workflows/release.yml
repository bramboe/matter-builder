name: Release

# Builds every package in packages/ on mb_core from Matter Builder (the
# version in MB_VERSION), writes a manifest with SHA-256 hashes, signs it with
# this source's key (secret MB_SIGNING_KEY; the public half is
# matter-builder-key.pem) and publishes a GitHub release. Start it with a tag
# "v<version>".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MB_REPO: bramboe/matter-builder
  MB_VERSION: v0.1.17
  IDF_IMAGE: espressif/idf:v5.5.5
  ESP_MATTER_COMMIT: fe1efc6cdf62f19b5ca44213900333a6aad7a8b2

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/mb && sudo chown "$(id -u):$(id -g)" /mnt/mb

      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MB_REPO }}
          ref: ${{ env.MB_VERSION }}
          path: matter-builder

      - name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: /mnt/mb/toolchain
          key: toolchain-${{ env.ESP_MATTER_COMMIT }}-2

      - name: Toolchain and build (Espressif image)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -v /mnt/mb:/mb \
            -e MB_DATA=/mb -e MB_SRC=/w/matter-builder -e ESP_MATTER_COMMIT \
            -e IDF_PYTHON_ENV_PATH=/mb/toolchain/python_env -e HOME=/mb/home \
            --entrypoint bash "$IDF_IMAGE" -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential pkg-config libffi-dev libssl-dev \
                libdbus-1-dev libglib2.0-dev libavahi-client-dev libgirepository1.0-dev libcairo2-dev \
                libreadline-dev python3-dev python3-venv unzip > /dev/null
              if [ ! -f "/mb/toolchain/ready-$ESP_MATTER_COMMIT" ]; then
                bash /w/matter-builder/ha-addon/matter_builder/toolchain.sh
              fi
              for project in /w/source/packages/*/; do
                bash /w/matter-builder/ha-addon/matter_builder/build.sh project "$project"
              done
              chown -R '"$(id -u):$(id -g)"' /mb'

      - name: Manifest and signature
        env:
          MB_SIGNING_KEY: ${{ secrets.MB_SIGNING_KEY }}
        run: python3 matter-builder/tools/release_manifest.py /mnt/mb/firmware "${GITHUB_REF_NAME}" source

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Signed firmware for the ESP32-C6" \
            /mnt/mb/firmware/*.bin /mnt/mb/firmware/factory/*.bin /mnt/mb/firmware/manifest.json /mnt/mb/firmware/manifest.json.sig
